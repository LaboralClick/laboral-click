<div id="bloque-botones-final" style="display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:600px;margin-left:auto;margin-right:auto;">

  <!-- BOTON 1: DESCARGAR CONSTANCIA - SE QUEDA IGUAL -->
  <a id="btnDescargaConstancia" href="#" onclick="window.print(); return false;" 
     style="display:block;width:100%;box-sizing:border-box;background:#0f2a5e;color:#ffffff;padding:16px 20px;text-align:center;border-radius:12px;font-weight:900;font-size:14px;letter-spacing:0.5px;text-decoration:none;cursor:pointer;text-transform:uppercase;">

  <!-- BOTON 2: REVISAR MULTA - EL NUEVO PARA ROJO -->

     href="https://wa.me/5213111866901?text=Hola%20Domiciano%2C%20hice%20el%20Sem%C3%A1foro%20y%20me%20sali%C3%B3%20RIESGO%20ALTO.%20Quiero%20revisar%20cu%C3%A1nto%20me%20tocar%C3%ADa%20pagar."
     target="_blank" rel="noopener"
     style="display:block;width:100%;box-sizing:border-box;background:#c9a028;color:#0f2a5e;padding:16px 20px;text-align:center;border-radius:12px;font-weight:900;font-size:14px;letter-spacing:0.5px;text-decoration:none;cursor:pointer;text-transform:uppercase;box-shadow:0 4px 12px rgba(201,160,40,0.3);">
    QUIERO REVISAR CUÁNTO ME TOCARÍA PAGAR
  </a>

</div>

<script>
// ESTE SCRIPT PONE EL FOLIO AUTOMATICO - NO TOQUES NADA
// Busca el folio que ya generas como LC-2026-16KLB en tu pagina y lo mete al WhatsApp
(function() {
  function actualizarLinkWhatsApp() {
    var folioEl = document.querySelector('[id*="folio"], [class*="folio"], .folio');
    var folioTexto = '';
    
    // Intenta sacar el folio de tu texto actual (ej: Folio: LC-2026-16KLB)
    if (folioEl) {
      folioTexto = folioEl.textContent || folioEl.innerText || '';
    } else {
      // Si no lo encuentra por clase, busca en todo el body el patron LC-2026-
      var bodyText = document.body.innerHTML;
      var match = bodyText.match(/LC-2026-[A-Z0-9]+/);
      if (match) folioTexto = match[0];
    }
    
    // Limpia y deja solo el codigo LC-2026-XXXX
    var folioLimpio = (folioTexto.match(/LC-2026-[A-Z0-9]+/) || ['LC-2026-XXXX'])[0];
    
    var btn = document.getElementById('btnRevisarMulta');
    if (btn) {
      var mensaje = `Hola Domiciano, hice el Semáforo y me salió RIESGO ALTO. Folio: ${folioLimpio} Quiero revisar cuánto me tocaría pagar.`;
      btn.href = `https://wa.me/5213111866901?text=${encodeURIComponent(mensaje)}`;
    }
  }
  
  // Ejecuta al cargar y 1 seg despues por si tu folio tarda
  document.addEventListener('DOMContentLoaded', actualizarLinkWhatsApp);
  setTimeout(actualizarLinkWhatsApp, 1000);
  setTimeout(actualizarLinkWhatsApp, 2500);
})();
</script>
