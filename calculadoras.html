<script>
  // ============================================
  // MOTOR DE CÁLCULO LABORAL CLICK
  // Conforme a Ley Federal del Trabajo (México)
  // Corrección: agosto 2026
  // ============================================

  let tipoCalculo = 'finiquito';
  const SALARIO_MINIMO_DIARIO = 248.93; // MXN - Salario Mínimo General 2026
  const TOPE_PRIMA_ANTIGUEDAD = SALARIO_MINIMO_DIARIO * 2; // 2x SMG = $497.86

  function seleccionarTipo(tipo) {
    tipoCalculo = tipo;
    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.classList.remove('activo');
    });
    event.target.closest('.tipo-btn').classList.add('activo');
  }

  // Calcula días entre dos fechas (inclusive)
  function calcularDiasEntre(fecha1, fecha2) {
    const d1 = new Date(fecha1 + 'T00:00:00');
    const d2 = new Date(fecha2 + 'T00:00:00');
    const diffMs = d2 - d1;
    return Math.floor(diffMs / (24 * 60 * 60 * 1000)) + 1;
  }

  // Calcula días desde el 1 de enero del año de salida hasta la fecha de salida
  function calcularDiasAguinaldoAnual(fechaSalida) {
    const salida = new Date(fechaSalida + 'T00:00:00');
    const inicioAnio = new Date(salida.getFullYear(), 0, 1); // 1 de enero
    const diffMs = salida - inicioAnio;
    return Math.floor(diffMs / (24 * 60 * 60 * 1000)) + 1;
  }

  // Calcula días desde el último aniversario laboral hasta la fecha de salida
  function calcularDiasVacacionesAnuales(fechaIngreso, fechaSalida) {
    const ingreso = new Date(fechaIngreso + 'T00:00:00');
    const salida = new Date(fechaSalida + 'T00:00:00');
    
    // Calcular años completos trabajados
    let aniosCompletos = salida.getFullYear() - ingreso.getFullYear();
    const ultimoAniversario = new Date(ingreso);
    ultimoAniversario.setFullYear(ingreso.getFullYear() + aniosCompletos);
    
    // Si el aniversario aún no ha pasado en este año, restar uno
    if (ultimoAniversario > salida) {
      aniosCompletos--;
      ultimoAniversario.setFullYear(ultimoAniversario.getFullYear() - 1);
    }
    
    // Días desde el último aniversario hasta la fecha de salida
    const diffMs = salida - ultimoAniversario;
    return Math.floor(diffMs / (24 * 60 * 60 * 1000)) + 1;
  }

  // Calcula años proporcionales de antigüedad
  function calcularAntiguedadAnos(fechaIngreso, fechaSalida) {
    const totalDias = calcularDiasEntre(fechaIngreso, fechaSalida);
    return totalDias / 365.25;
  }

  // Calcula el Salario Diario Integrado (SDI)
  // Factor estándar para prestaciones mínimas: 15 días aguinaldo + 12 días vacaciones + 25% prima vacacional
  function calcularSDI(salarioDiario, diasAguinaldo, diasVacaciones, primaVacacionalPorcentaje) {
    const factorIntegracion = 1 + 
      (diasAguinaldo / 365) + 
      (diasVacaciones / 365) + 
      (diasVacaciones * (primaVacacionalPorcentaje / 100) / 365);
    return salarioDiario * factorIntegracion;
  }

  // Formatea moneda
  function formatearMoneda(monto) {
    return '$' + monto.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
  }

  // ============================================
  // EVENTO PRINCIPAL DE CÁLCULO
  // ============================================
  document.getElementById('calculadoraForm').addEventListener('submit', function(e) {
    e.preventDefault(); // Evita recarga/redirección de la página

    // Obtener valores del formulario
    const salarioDiario = parseFloat(document.getElementById('salarioDiario').value);
    const diasAguinaldo = parseFloat(document.getElementById('diasAguinaldo').value);
    const fechaIngreso = document.getElementById('fechaIngreso').value;
    const fechaSalida = document.getElementById('fechaSalida').value;
    const diasVacaciones = parseFloat(document.getElementById('diasVacaciones').value);
    const primaVacacionalPorcentaje = parseFloat(document.getElementById('primaVacacionalPorcentaje').value);

    // Validaciones básicas
    if (isNaN(salarioDiario) || isNaN(diasAguinaldo) || isNaN(diasVacaciones) || isNaN(primaVacacionalPorcentaje)) {
      alert('Por favor complete todos los campos correctamente.');
      return;
    }

    if (fechaIngreso >= fechaSalida) {
      alert('La fecha de ingreso debe ser anterior a la fecha de salida.');
      return;
    }

    // ============================================
    // CÁLCULOS BASE
    // ============================================
    const totalDiasTrabajados = calcularDiasEntre(fechaIngreso, fechaSalida);
    const antiguedadAnos = calcularAntiguedadAnos(fechaIngreso, fechaSalida);
    const diasAguinaldoAnual = calcularDiasAguinaldoAnual(fechaSalida);
    const diasVacacionesAnuales = calcularDiasVacacionesAnuales(fechaIngreso, fechaSalida);

    let desglose = [];
    let total = 0;

    // ============================================
    // PARTE 1: FINIQUITO (Partes Proporcionales)
    // Aplica en ambos casos (renuncia y despido)
    // ============================================

    // 1. Aguinaldo proporcional
    // Fórmula: días desde 1 enero hasta fecha salida × (días aguinaldo / 365) × salario diario
    const aguinaldoProporcional = diasAguinaldoAnual * (diasAguinaldo / 365) * salarioDiario;
    desglose.push({ 
      concepto: `Aguinaldo proporcional (${diasAguinaldoAnual} días del año)`, 
      monto: aguinaldoProporcional 
    });
    total += aguinaldoProporcional;

    // 2. Vacaciones proporcionales
    // Fórmula: días desde último aniversario hasta fecha salida × (días vacaciones / 365) × salario diario
    const vacacionesProporcionales = diasVacacionesAnuales * (diasVacaciones / 365) * salarioDiario;
    desglose.push({ 
      concepto: `Vacaciones proporcionales (${diasVacacionesAnuales} días del periodo)`, 
      monto: vacacionesProporcionales 
    });
    total += vacacionesProporcionales;

    // 3. Prima vacacional
    // Fórmula: vacaciones proporcionales × % prima vacacional
    const primaVacacionalMonto = vacacionesProporcionales * (primaVacacionalPorcentaje / 100);
    desglose.push({ 
      concepto: `Prima vacacional (${primaVacacionalPorcentaje}%)`, 
      monto: primaVacacionalMonto 
    });
    total += primaVacacionalMonto;

    // ============================================
    // PARTE 2: LIQUIDACIÓN (Solo si es despido)
    // ============================================
    if (tipoCalculo === 'liquidacion') {
      // Calcular Salario Diario Integrado (SDI)
      const sdi = calcularSDI(salarioDiario, diasAguinaldo, diasVacaciones, primaVacacionalPorcentaje);

      // 4. Indemnización constitucional de 90 días
      // Fórmula: 90 × SDI (Art. 50 LFT)
      const indemnizacion90Dias = 90 * sdi;
      desglose.push({ 
        concepto: `Indemnización constitucional (90 días × SDI ${formatearMoneda(sdi)})`, 
        monto: indemnizacion90Dias 
      });
      total += indemnizacion90Dias;

      // 5. 20 días de salario por cada año trabajado
      // Fórmula: 20 × SDI × años proporcionales (NO por días totales)
      const veinteDiasPorAnio = 20 * sdi * antiguedadAnos;
      desglose.push({ 
        concepto: `20 días por año trabajado (20 × SDI × ${antiguedadAnos.toFixed(2)} años)`, 
        monto: veinteDiasPorAnio 
      });
      total += veinteDiasPorAnio;

      // 6. Prima de antigüedad
      // Fórmula: 12 × Salario_Topado × años proporcionales
      // Tope: 2 × Salario Mínimo General ($497.86 MXN)
      const salarioTopado = Math.min(salarioDiario, TOPE_PRIMA_ANTIGUEDAD);
      const primaAntiguedad = 12 * salarioTopado * antiguedadAnos;
      desglose.push({ 
        concepto: `Prima de antigüedad (12 días × ${formatearMoneda(salarioTopado)} tope × ${antiguedadAnos.toFixed(2)} años)`, 
        monto: primaAntiguedad 
      });
      total += primaAntiguedad;
    }

    // ============================================
    // MOSTRAR RESULTADOS
    // ============================================
    document.getElementById('tipoResultado').textContent = 
      tipoCalculo === 'finiquito' 
        ? 'FINIQUITO (Renuncia Voluntaria)' 
        : 'LIQUIDACIÓN (Despido Injustificado)';
    
    document.getElementById('montoTotal').textContent = formatearMoneda(total);
    
    const desgloseHTML = desglose.map(item => `
      <div class="desglose-item">
        <span class="concepto">${item.concepto}</span>
        <span class="monto">${formatearMoneda(item.monto)}</span>
      </div>
    `).join('');
    
    document.getElementById('desgloseItems').innerHTML = desgloseHTML;
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
</script>
