<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Multas LFT 2026 - LaboralClick</title>
<style>
  :root{--guinda:#9d2449;--guinda-dark:#7a1c39;--dorado:#b38e5d;--bg:#f8f7f5;--card:#ffffff;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;--ok:#16a34a;}
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--text);}
  #lc-lft-pro{max-width:1100px;margin:0 auto;padding:24px}
  .lc-badge{display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
  .lc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.04)}
  .lc-grid{display:grid;gap:20px}
  @media(min-width:900px){.lc-grid{grid-template-columns:380px 1fr}}
  h1{margin:0 0 8px;font-size:28px;letter-spacing:-.02em}
  h2{font-size:16px;margin:0 0 12px}
  .lc-uma{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
  .lc-uma div{background:#fdf2f4;border:1px solid #f4c2cf;border-radius:12px;padding:12px;text-align:center}
  .lc-uma b{display:block;font-size:20px;color:var(--guinda)}
  .lc-uma span{font-size:11px;color:var(--muted)}
  label{font-size:12px;font-weight:600;color:#374151;display:block;margin:12px 0 6px}
  select,input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:white}
  .lc-tabs{display:flex;gap:8px;margin:12px 0}
  .lc-tab{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:#f9fafb;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
  .lc-tab.active{background:var(--guinda);color:white;border-color:var(--guinda)}
  .lc-result{background:linear-gradient(135deg,#9d2449 0%,#7a1c39 100%);color:white;border-radius:16px;padding:22px}
  .lc-result .big{font-size:32px;font-weight:800;margin:6px 0}
  .lc-kbd{font-family:ui-monospace,monospace;background:#f3f4f6;border:1px solid #e5e7eb;padding:2px 6px;border-radius:6px;font-size:11px}
  .lc-type{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;margin:6px 0}
  .lc-type.UNICA{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
  .lc-type.POR_TRABAJADOR_AFECTADO{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
  .lc-type.POR_TOTAL_PLANTILLA{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
  .lc-type.POR_CADA_TRABAJADOR_OMISION{background:#ffe4e6;color:#9f1239;border:1px solid #fda4af}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
  th{font-size:11px;color:var(--muted);text-transform:uppercase}
  .lc-note{font-size:11px;color:var(--muted);line-height:1.5;background:#f9fafb;border:1px dashed var(--border);border-radius:10px;padding:10px}
  .lc-btn{width:100%;background:var(--guinda);color:white;border:0;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
  .lc-btn:hover{background:var(--guinda-dark)}
</style>
</head>
<body>
<div id="lc-lft-pro">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
    <div>
      <h1>Calculadora de Multas LFT 2026</h1>
      <p style="margin:0;color:var(--muted);font-size:14px">Motor jurídico diferenciado · Arts. 994 al 1004-C · UMA oficial automática + manual</p>
    </div>
    <span class="lc-badge">● UMA 2026 VIGENTE · INEGI DOF 09/01/2026</span>
  </div>

  <!-- CONFIG EDITABLE -->
  <div class="lc-card" style="margin-bottom:20px">
    <h2>⚙️ UMA Oficial - Configuración (Edita aquí cada febrero)</h2>
    <div class="lc-tabs">
      <div class="lc-tab active" id="tab-manual" onclick="setModo('MANUAL')">MANUAL - Recomendado</div>
      <div class="lc-tab" id="tab-auto" onclick="setModo('AUTO')">AUTOMÁTICO - API</div>
    </div>
    <div id="panel-manual">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div><label>UMA Diaria 2026 ($)</label><input id="umaD" type="number" step="0.01" value="117.31"></div>
        <div><label>UMA Mensual ($)</label><input id="umaM" type="number" step="0.01" value="3566.22"></div>
        <div><label>UMA Anual ($)</label><input id="umaA" type="number" step="0.01" value="42794.64"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">
        <div><label>Vigencia</label><input id="umaVig" value="2026-02-01 al 2027-01-31"></div>
        <div><label>Fuente</label><input id="umaFuente" value="INEGI DOF 09/01/2026"></div>
      </div>
      <button class="lc-btn" style="margin-top:12px" onclick="guardarUMA()">Guardar UMA Manual y Recalcular</button>
      <p class="lc-note" style="margin-top:10px">Este es el modo que usan El Universal y las calculadoras serias. INEGI no da API con CORS. Guardas en localStorage y no dependes de terceros. Cada febrero editas los 3 números.</p>
    </div>
    <div id="panel-auto" style="display:none">
      <button class="lc-btn" style="background:#111" onclick="fetchUMA()">Intentar Actualizar UMA Automática</button>
      <p id="logAuto" class="lc-note" style="margin-top:10px">Intentará: api.uma.com.mx / mexico-datos-api. Si falla por CORS es normal, usa MANUAL.</p>
    </div>
    <div class="lc-uma">
      <div><b id="showD">$117.31</b><span>DIARIA</span></div>
      <div><b id="showM">$3,566.22</b><span>MENSUAL</span></div>
      <div><b id="showA">$42,794.64</b><span>ANUAL</span></div>
    </div>
  </div>

  <div class="lc-grid">
    <div class="lc-card">
      <h2>\uD83D\uDCCB Datos de la Infracción</h2>
      <label>Tipo de infracción LFT</label>
      <select id="infraccion"></select>
      <div id="fichaTipo" style="margin-top:10px"></div>
      
      <label>Número de trabajadores afectados directamente</label>
      <input id="trabAfect" type="number" min="1" value="1">
      
      <label>Total de plantilla de la empresa (si aplica)</label>
      <input id="totalPlant" type="number" min="1" value="10">
      <p class="lc-note">Para infracciones UNICA ignora plantilla. Para POR_TOTAL_PLANTILLA se usa el total. Para POR_TRABAJADOR usa afectados.</p>

      <label>Tamaño de empresa (atenuante STPS)</label>
      <select id="tamEmpresa">
        <option value="1">Mediana/Grande (100%)</option>
        <option value="0.8">Pequeña (80%)</option>
        <option value="0.5">Micro (50% - criterio atenuante)</option>
      </select>

      <label style="display:flex;gap:8px;align-items:center;margin-top:16px"><input id="reinc" type="checkbox" style="width:auto"> ¿Reincidencia? Art 1001 duplica</label>
      <label style="display:flex;gap:8px;align-items:center"><input id="diasCheck" type="checkbox" style="width:auto" onchange="document.getElementById('diasWrap').style.display=this.checked?'block':'none'"> ¿Infracción por días?</label>
      <div id="diasWrap" style="display:none"><label>Días de duración</label><input id="dias" type="number" min="1" value="1"></div>
    </div>

    <div>
      <div class="lc-result">
        <div style="font-size:12px;opacity:.8">MONTO ESTIMADO LFT 2026</div>
        <div class="big" id="resProm">$0 MXN</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:13px">
          <div style="background:rgba(255,255,255,.12);padding:10px;border-radius:10px">Mínimo<br><b id="resMin">$0</b></div>
          <div style="background:rgba(255,255,255,.12);padding:10px;border-radius:10px">Máximo<br><b id="resMax">$0</b></div>
        </div>
        <div id="resFormula" style="margin-top:16px;font-size:12px;line-height:1.6;background:rgba(0,0,0,.2);padding:12px;border-radius:10px;font-family:monospace"></div>
      </div>

      <div class="lc-card" style="margin-top:16px">
        <h2>\uD83D\uDCD6 Ficha Legal</h2>
        <div id="fichaLegal" style="font-size:13px;line-height:1.6"></div>
      </div>

      <div class="lc-card" style="margin-top:16px">
        <h2>\uD83D\uDCCA Tabla de referencia Arts. 994-1004-C</h2>
        <table>
          <tr><th>Art</th><th>Tipo Aplicación</th><th>Rango UMA</th></tr>
          <tr><td>994-I</td><td>UNICA</td><td>50-250</td></tr>
          <tr><td>994-III</td><td>POR TRABAJADOR</td><td>50-250 x trab</td></tr>
          <tr><td>995</td><td>UNICA</td><td>250-5000</td></tr>
          <tr><td>995-BIS</td><td>POR TRABAJADOR</td><td>250-5000 x trab</td></tr>
          <tr><td>996 Sal. Mín</td><td>POR TRABAJADOR</td><td>50-250 x trab</td></tr>
          <tr><td>998 PTU</td><td>POR CADA OMISIÓN</td><td>250-5000 x trab</td></tr>
          <tr><td>999 IMSS</td><td>POR CADA OMISIÓN</td><td>250-5000 x trab</td></tr>
          <tr><td>1000 Capacit.</td><td>POR PLANTILLA</td><td>50-1500</td></tr>
          <tr><td>1002 Outsourcing</td><td>POR PLANTILLA</td><td>2000-50000</td></tr>
          <tr><td>1004-C Acoso</td><td>POR TRABAJADOR</td><td>250-5000 x trab</td></tr>
        </table>
      </div>
    </div>
  </div>

  <p class="lc-note" style="margin-top:20px">⚠️ Aviso: Cálculo orientativo con UMA 2026 oficial. No sustituye dictamen de inspección STPS. LaboralClick recomienda validación jurídica. Fuente UMA: INEGI DOF 09/01/2026.</p>
</div>

<script>
// === CONFIG OFICIAL - EDITAR CADA FEBRERO ===
const DEFAULT_UMA = { diaria: 117.31, mensual: 3566.22, anual: 42794.64, vigencia: "2026-02-01 al 2027-01-31", fuente: "INEGI DOF 09/01/2026" };
let UMA = {...DEFAULT_UMA};
let MODO = localStorage.getItem('lc_modo') || 'MANUAL';
const saved = localStorage.getItem('lc_uma_2026');
if(saved){ try{ UMA = JSON.parse(saved); }catch(e){} }

// CATALOGO JURIDICO DIFERENCIADO - CORE DE SERIEDAD
const CATALOGO = [
  {id:"994-I", art:"Art 994 Frac I", desc:"Condiciones generales de trabajo (jornada, descanso, vacaciones)", tipo:"UNICA", min:50, max:250, base:"Por hecho infractor", nota:"Una sola multa por centro de trabajo, no importa si afecta a 1 o 100 trabajadores. Criterio de la STPS."},
  {id:"994-III", art:"Art 994 Frac III", desc:"No entregar contrato por escrito", tipo:"POR_TRABAJADOR_AFECTADO", min:50, max:250, base:"Por cada trabajador sin contrato", nota:"Se multiplica por cada trabajador afectado. Si a 3 no les diste contrato, son 3 infracciones."},
  {id:"994-IV", art:"Art 994 Frac IV", desc:"No tener lista de raya / nómina", tipo:"UNICA", min:50, max:250, base:"Por centro de trabajo", nota:"Omisión documental general, se sanciona una vez."},
  {id:"995", art:"Art 995", desc:"Seguridad e Higiene - Riesgo inminente", tipo:"UNICA", min:250, max:5000, base:"Por hecho que pone en riesgo la vida", nota:"Puede clausurarse centro. Multa única pero alta."},
  {id:"995-BIS", art:"Art 995 BIS", desc:"Trabajo infantil peligroso", tipo:"POR_TRABAJADOR_AFECTADO", min:250, max:5000, base:"Por cada menor afectado", nota:"Por cada menor encontrado."},
  {id:"996", art:"Art 996", desc:"No pagar salario mínimo", tipo:"POR_TRABAJADOR_AFECTADO", min:50, max:250, base:"Por cada trabajador mal pagado", nota:"Texto LFT: 'por cada trabajador'. Determinante."},
  {id:"997", art:"Art 997", desc:"Jornada ilegal / Horas extra no pagadas", tipo:"POR_TRABAJADOR_AFECTADO", min:50, max:250, base:"Por cada trabajador afectado", nota:"Se calcula por trabajador con jornada excedida."},
  {id:"998", art:"Art 998", desc:"No pagar PTU - Reparto de utilidades", tipo:"POR_CADA_TRABAJADOR_OMISION", min:250, max:5000, base:"Por cada trabajador sin PTU", nota:"Omisión general que se individualiza por trabajador que no recibió."},
  {id:"999", art:"Art 999", desc:"No afiliar IMSS / INFONAVIT", tipo:"POR_CADA_TRABAJADOR_OMISION", min:250, max:5000, base:"Por cada trabajador no afiliado", nota:"Multa por cada omisión de inscripción."},
  {id:"1000", art:"Art 1000", desc:"Capacitación y adiestramiento", tipo:"POR_TOTAL_PLANTILLA", min:50, max:1500, base:"Sobre total de plantilla", nota:"Obligación es tener programa para TODA la plantilla. Se sanciona sobre plantilla total, no solo afectados."},
  {id:"1002", art:"Art 1002", desc:"Outsourcing ilegal / Subcontratación prohibida", tipo:"POR_TOTAL_PLANTILLA", min:2000, max:50000, base:"Sobre plantilla en esquema ilegal", nota:"La más alta de la LFT. Se calcula sobre trabajadores usados en outsourcing."},
  {id:"1004-C", art:"Art 1004-C", desc:"Discriminación, Acoso, Hostigamiento", tipo:"POR_TRABAJADOR_AFECTADO", min:250, max:5000, base:"Por cada víctima", nota:"Por cada trabajador discriminado/acosado."},
];

const els = {
  infra: document.getElementById('infraccion'),
  trab: document.getElementById('trabAfect'),
  plant: document.getElementById('totalPlant'),
  tam: document.getElementById('tamEmpresa'),
  reinc: document.getElementById('reinc'),
  diasCheck: document.getElementById('diasCheck'),
  dias: document.getElementById('dias'),
  resMin: document.getElementById('resMin'),
  resMax: document.getElementById('resMax'),
  resProm: document.getElementById('resProm'),
  resFormula: document.getElementById('resFormula'),
  fichaTipo: document.getElementById('fichaTipo'),
  fichaLegal: document.getElementById('fichaLegal'),
  showD: document.getElementById('showD'), showM: document.getElementById('showM'), showA: document.getElementById('showA')
};

function init(){
  CATALOGO.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.id; o.textContent=\`\${c.art} - \${c.desc} (\${c.min}-\${c.max} UMA)\`;
    els.infra.appendChild(o);
  });
  document.getElementById('umaD').value=UMA.diaria;
  document.getElementById('umaM').value=UMA.mensual;
  document.getElementById('umaA').value=UMA.anual;
  document.getElementById('umaVig').value=UMA.vigencia;
  document.getElementById('umaFuente').value=UMA.fuente;
  updateShow();
  setModo(MODO);
  ['change','input'].forEach(ev=>{
    els.infra.addEventListener(ev,calcular);
    els.trab.addEventListener(ev,calcular);
    els.plant.addEventListener(ev,calcular);
    els.tam.addEventListener(ev,calcular);
    els.reinc.addEventListener(ev,calcular);
    els.dias.addEventListener(ev,calcular);
    els.diasCheck.addEventListener(ev,calcular);
  });
  calcular();
}

function updateShow(){
  els.showD.textContent='$'+Number(UMA.diaria).toLocaleString('es-MX',{minimumFractionDigits:2});
  els.showM.textContent='$'+Number(UMA.mensual).toLocaleString('es-MX',{minimumFractionDigits:2});
  els.showA.textContent='$'+Number(UMA.anual).toLocaleString('es-MX',{minimumFractionDigits:2});
}

function setModo(m){
  MODO=m; localStorage.setItem('lc_modo',m);
  document.getElementById('tab-manual').classList.toggle('active',m==='MANUAL');
  document.getElementById('tab-auto').classList.toggle('active',m==='AUTO');
  document.getElementById('panel-manual').style.display=m==='MANUAL'?'block':'none';
  document.getElementById('panel-auto').style.display=m==='AUTO'?'block':'none';
}

function guardarUMA(){
  UMA.diaria=parseFloat(document.getElementById('umaD').value)||117.31;
  UMA.mensual=parseFloat(document.getElementById('umaM').value)||3566.22;
  UMA.anual=parseFloat(document.getElementById('umaA').value)||42794.64;
  UMA.vigencia=document.getElementById('umaVig').value;
  UMA.fuente=document.getElementById('umaFuente').value;
  localStorage.setItem('lc_uma_2026',JSON.stringify(UMA));
  updateShow(); calcular();
  alert('UMA guardada: $'+UMA.diaria+' vigente '+UMA.vigencia);
}

async function fetchUMA(){
  const log=document.getElementById('logAuto');
  log.textContent='Intentando...';
  const urls=["https://mexico-datos-api.vercel.app/api/uma","https://api.uma.com.mx/v1/uma/current"];
  for(let url of urls){
    try{
      const r=await fetch(url); const j=await r.json();
      // intentar parsear estructura
      let val = j.diaria || j.valor || j.uma?.diaria || j.data?.diaria;
      if(val){ UMA.diaria=parseFloat(val); updateShow(); log.textContent='Actualizado desde '+url+': $'+val; calcular(); return; }
    }catch(e){ log.textContent='Fallo CORS en '+url+' -> '+e.message; }
  }
  log.textContent='No se pudo auto. INEGI no da CORS. Usa modo MANUAL con 117.31 (oficial 2026).';
}

function getInfra(){ return CATALOGO.find(c=>c.id===els.infra.value) || CATALOGO[0]; }

function calcular(){
  const infra=getInfra();
  const trab=parseInt(els.trab.value)||1;
  const plant=parseInt(els.plant.value)||1;
  const tam=parseFloat(els.tam.value)||1;
  const reinc=els.reinc.checked;
  const porDias=els.diasCheck && els.diasCheck.checked;
  const dias=parseInt(els.dias?.value)||1;

  let mult = 1;
  let tipoExp="";
  if(infra.tipo==="UNICA"){ mult=1; tipoExp="UNICA: 1 sola multa por el hecho, sin importar trabajadores"; }
  else if(infra.tipo==="POR_TRABAJADOR_AFECTADO"){ mult=trab; tipoExp=\`POR TRABAJADOR AFECTADO: \${trab} trabajador(es) afectado(s)\`; }
  else if(infra.tipo==="POR_CADA_TRABAJADOR_OMISION"){ mult=trab; tipoExp=\`POR CADA OMISIÓN: \${trab} trabajador(es) sin prestación\`; }
  else if(infra.tipo==="POR_TOTAL_PLANTILLA"){ mult=plant; tipoExp=\`POR TOTAL PLANTILLA: \${plant} trabajador(es) en plantilla\`; }

  if(porDias) mult*=dias;

  let min = UMA.diaria * infra.min * mult * tam;
  let max = UMA.diaria * infra.max * mult * tam;
  if(reinc){ min*=2; max*=2; }

  const prom=(min+max)/2;
  els.resMin.textContent=min.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
  els.resMax.textContent=max.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
  els.resProm.textContent=prom.toLocaleString('es-MX',{style:'currency',currency:'MXN'});

  els.resFormula.innerHTML=\`Fórmula: <b>UMA ($\${UMA.diaria}) × Rango [\${infra.min}-\${infra.max}] × Multiplicador (\${mult}) × Tamaño (\${tam})\${reinc?' ×2 reincidencia':''}</b><br>→ Min: \${UMA.diaria}×\${infra.min}×\${mult}×\${tam}\${reinc?'×2':''} = \${min.toLocaleString('es-MX')}<br>→ Max: \${UMA.diaria}×\${infra.max}×\${mult}×\${tam}\${reinc?'×2':''}\`;

  els.fichaTipo.innerHTML=\`<div class="lc-type \${infra.tipo}">\${infra.tipo.replace(/_/g,' ')}</div><div class="lc-note"><b>\${tipoExp}</b><br>\${infra.nota}</div>\`;
  els.fichaLegal.innerHTML=\`<b>\${infra.art}</b><br>\${infra.desc}<br><br><b>Base legal:</b> \${infra.base}<br><b>Rango:</b> \${infra.min} a \${infra.max} UMA<br><b>Tipo:</b> \${infra.tipo}<br><br><span class="lc-kbd">\${UMA.fuente} - \${UMA.vigencia}</span>\`;
}

init();
<\/script>
