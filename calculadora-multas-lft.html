<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Multas LFT 2026 - LaboralClick</title>
<style>
  :root{--guinda:#9d2449;--bg:#f8f7f5;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;}
  *{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
  body{margin:0;background:var(--bg);color:var(--text)}
  #lc-lft-pro{max-width:1100px;margin:0 auto;padding:24px}
 .lc-badge{display:inline-flex;background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
 .lc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 4px 24px rgba(0,0,0,.04)}
 .lc-grid{display:grid;gap:20px}
  @media(min-width:900px){.lc-grid{grid-template-columns:380px 1fr}}
  label{font-size:12px;font-weight:600;display:block;margin:12px 0 6px}
  select,input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
 .lc-tabs{display:flex;gap:8px;margin:12px 0}
 .lc-tab{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:#f9fafb;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
 .lc-tab.active{background:#9d2449;color:white;border-color:#9d2449}
 .lc-uma{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
 .lc-uma div{background:#fdf2f4;border:1px solid #f4c2cf;border-radius:12px;padding:12px;text-align:center}
 .lc-uma b{display:block;font-size:20px;color:#9d2449}
 .lc-result{background:linear-gradient(135deg,#9d2449 0%,#7a1c39 100%);color:white;border-radius:16px;padding:22px}
 .lc-result.big{font-size:32px;font-weight:800;margin:6px 0}
 .lc-type{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;display:inline-flex;margin:6px 0}
 .lc-type.UNICA{background:#fef3c7;color:#92400e}
 .lc-type.POR_TRABAJADOR_AFECTADO{background:#dbeafe;color:#1e40af}
 .lc-type.POR_TOTAL_PLANTILLA{background:#ede9fe;color:#5b21b6}
 .lc-type.POR_CADA_TRABAJADOR_OMISION{background:#ffe4e6;color:#9f1239}
 .lc-note{font-size:11px;color:#6b7280;background:#f9fafb;border:1px dashed #e5e7eb;border-radius:10px;padding:10px}
 .lc-btn{width:100%;background:#9d2449;color:white;border:0;padding:12px;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="lc-lft-pro">
  <h1>Calculadora de Multas LFT 2026</h1>
  <p style="color:#6b7280;font-size:14px">Arts. 994 al 1004-C · UMA oficial 117.31 · Motor diferenciado</p>
  <span class="lc-badge">● UMA 2026 VIGENTE · INEGI DOF 09/01/2026</span>

  <div class="lc-card" style="margin:20px 0">
    <div class="lc-tabs">
      <div class="lc-tab active" id="tab-manual" onclick="setModo('MANUAL')">MANUAL - Recomendado</div>
      <div class="lc-tab" id="tab-auto" onclick="setModo('AUTO')">AUTOMÁTICO</div>
    </div>
    <div id="panel-manual">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div><label>UMA Diaria 2026</label><input id="umaD" type="number" value="117.31"></div>
        <div><label>UMA Mensual</label><input id="umaM" type="number" value="3566.22"></div>
        <div><label>UMA Anual</label><input id="umaA" type="number" value="42794.64"></div>
      </div>
      <button class="lc-btn" style="margin-top:12px" onclick="guardarUMA()">Guardar UMA Manual y Recalcular</button>
    </div>
    <div id="panel-auto" style="display:none">
      <button class="lc-btn" style="background:#111" onclick="fetchUMA()">Intentar UMA Automática</button>
      <p id="logAuto" class="lc-note" style="margin-top:10px">INEGI no da CORS, usa MANUAL.</p>
    </div>
    <div class="lc-uma">
      <div><b id="showD">$117.31</b>DIARIA</div>
      <div><b id="showM">$3,566.22</b>MENSUAL</div>
      <div><b id="showA">$42,794.64</b>ANUAL</div>
    </div>
  </div>

  <div class="lc-grid">
    <div class="lc-card">
      <label>Tipo de infracción LFT</label>
      <select id="infraccion"></select>
      <div id="fichaTipo" style="margin-top:10px"></div>
      <label>Trabajadores afectados</label><input id="trabAfect" type="number" value="1">
      <label>Total plantilla</label><input id="totalPlant" type="number" value="10">
      <label>Tamaño empresa</label>
      <select id="tamEmpresa"><option value="1">Mediana/Grande</option><option value="0.8">Pequeña</option><option value="0.5">Micro</option></select>
      <label><input id="reinc" type="checkbox"> ¿Reincidencia x2?</label>
    </div>
    <div>
      <div class="lc-result">
        <div class="big" id="resProm">$0 MXN</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>Mínimo<br><b id="resMin">$0</b></div>
          <div>Máximo<br><b id="resMax">$0</b></div>
        </div>
        <div id="resFormula" style="margin-top:12px;font-size:12px;background:rgba(0,0,0,.2);padding:10px;border-radius:10px"></div>
      </div>
      <div class="lc-card" style="margin-top:16px"><div id="fichaLegal"></div></div>
    </div>
  </div>
</div>
<script>
const DEFAULT_UMA={diaria:117.31,mensual:3566.22,anual:42794.64,vigencia:"2026-02-01 al 2027-01-31",fuente:"INEGI DOF 09/01/2026"};
let UMA={...DEFAULT_UMA};
const CATALOGO=[
{id:"994-I",art:"Art 994 Frac I",desc:"Condiciones generales",tipo:"UNICA",min:50,max:250,base:"Por hecho",nota:"Una multa por centro"},
{id:"994-III",art:"Art 994 Frac III",desc:"No entregar contrato",tipo:"POR_TRABAJADOR_AFECTADO",min:50,max:250,base:"Por trabajador",nota:"Por cada trabajador sin contrato"},
{id:"995",art:"Art 995",desc:"Seguridad e Higiene",tipo:"UNICA",min:250,max:5000,base:"Por hecho",nota:"Multa única alta"},
{id:"996",art:"Art 996",desc:"No pagar salario mínimo",tipo:"POR_TRABAJADOR_AFECTADO",min:50,max:250,base:"Por trabajador",nota:"Texto LFT: por cada trabajador"},
{id:"998",art:"Art 998",desc:"No pagar PTU",tipo:"POR_CADA_TRABAJADOR_OMISION",min:250,max:5000,base:"Por trabajador",nota:"Por cada trabajador sin PTU"},
{id:"999",art:"Art 999",desc:"No afiliar IMSS",tipo:"POR_CADA_TRABAJADOR_OMISION",min:250,max:5000,base:"Por trabajador",nota:"Por cada omisión"},
{id:"1000",art:"Art 1000",desc:"Capacitación",tipo:"POR_TOTAL_PLANTILLA",min:50,max:1500,base:"Plantilla total",nota:"Sobre plantilla total"},
{id:"1002",art:"Art 1002",desc:"Outsourcing ilegal",tipo:"POR_TOTAL_PLANTILLA",min:2000,max:50000,base:"Plantilla",nota:"La más alta"},
{id:"1004-C",art:"Art 1004-C",desc:"Discriminación/Acoso",tipo:"POR_TRABAJADOR_AFECTADO",min:250,max:5000,base:"Por víctima",nota:"Por cada víctima"},
];
function init(){
 const sel=document.getElementById('infraccion');
 CATALOGO.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=`${c.art} - ${c.desc} (${c.min}-${c.max} UMA)`;sel.appendChild(o);});
 document.getElementById('umaD').value=UMA.diaria;document.getElementById('umaM').value=UMA.mensual;document.getElementById('umaA').value=UMA.anual;
 updateShow(); calcular();
 ['change','input'].forEach(ev=>{
  sel.addEventListener(ev,calcular);
  document.getElementById('trabAfect').addEventListener(ev,calcular);
  document.getElementById('totalPlant').addEventListener(ev,calcular);
  document.getElementById('tamEmpresa').addEventListener(ev,calcular);
  document.getElementById('reinc').addEventListener(ev,calcular);
 });
}
function updateShow(){
 document.getElementById('showD').textContent='$'+UMA.diaria;
 document.getElementById('showM').textContent='$'+UMA.mensual;
 document.getElementById('showA').textContent='$'+UMA.anual;
}
function setModo(m){
 document.getElementById('tab-manual').classList.toggle('active',m==='MANUAL');
 document.getElementById('tab-auto').classList.toggle('active',m==='AUTO');
 document.getElementById('panel-manual').style.display=m==='MANUAL'?'block':'none';
 document.getElementById('panel-auto').style.display=m==='AUTO'?'block':'none';
}
function guardarUMA(){
 UMA.diaria=parseFloat(document.getElementById('umaD').value)||117.31;
 UMA.mensual=parseFloat(document.getElementById('umaM').value)||3566.22;
 UMA.anual=parseFloat(document.getElementById('umaA').value)||42794.64;
 localStorage.setItem('lc_uma_2026',JSON.stringify(UMA));updateShow();calcular();alert('Guardado $'+UMA.diaria);
}
function fetchUMA(){document.getElementById('logAuto').textContent='INEGI no da CORS. Usa MANUAL con 117.31 oficial 2026.';}
function calcular(){
 const infra=CATALOGO.find(c=>c.id===document.getElementById('infraccion').value)||CATALOGO[0];
 const trab=parseInt(document.getElementById('trabAfect').value)||1;
 const plant=parseInt(document.getElementById('totalPlant').value)||1;
 const tam=parseFloat(document.getElementById('tamEmpresa').value)||1;
 const reinc=document.getElementById('reinc').checked;
 let mult=infra.tipo==='UNICA'?1:(infra.tipo==='POR_TOTAL_PLANTILLA'?plant:trab);
 let min=UMA.diaria*infra.min*mult*tam;let max=UMA.diaria*infra.max*mult*tam;
 if(reinc){min*=2;max*=2;}
 const prom=(min+max)/2;
 document.getElementById('resMin').textContent=min.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
 document.getElementById('resMax').textContent=max.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
 document.getElementById('resProm').textContent=prom.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
 document.getElementById('resFormula').innerHTML=`UMA $${UMA.diaria} × ${infra.min}-${infra.max} × mult ${mult} = Min $${min.toLocaleString()}`;
 document.getElementById('fichaTipo').innerHTML=`<div class="lc-type ${infra.tipo}">${infra.tipo}</div><div class="lc-note">${infra.nota}</div>`;
 document.getElementById('fichaLegal').innerHTML=`<b>${infra.art}</b> - ${infra.desc}<br>Rango ${infra.min}-${infra.max} UMA<br>Tipo: ${infra.tipo}`;
}
init();
</script>
</body>
</html>
